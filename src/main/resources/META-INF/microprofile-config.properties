# ============================================
# PostgreSQL DataSource Configuration
# ============================================
datasource.url=jdbc:postgresql://localhost:3606/boloindia_dev?currentSchema=org_service
datasource.username=boloindia
datasource.password=boloindiapass
datasource.driver=org.postgresql.Driver

# ============================================
# Kafka Configuration
# ============================================
kafka.bootstrap.servers=localhost:9092
kafka.consumer.group.id=org-service-group
kafka.consumer.topic=org.registration.requested
kafka.producer.topic.created=org.created
kafka.producer.topic.approved=org.approved
kafka.producer.topic.rejected=org.rejected

# ============================================
# JWT Configuration
# ============================================
mp.jwt.verify.publickey.location=/keys/publicKey.pem
mp.jwt.verify.issuer=auth-service

# ============================================
# Service Configuration
# ============================================
service.name=org-service
service.version=1.0.0
service.port=8086
